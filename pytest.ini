[pytest]
testpaths = tests
# ROS launch_testing 플러그인이 수집 단계에서 디렉터리 전체를 import 한다 — 우리는 안 쓴다
addopts = -p no:launch_testing -p no:launch_ros
markers =
    unit: pure logic, no GPU and no ROS (default)
    gpu: needs CUDA (fabrics_sim / torch policy)
    ros: spins rclpy nodes in-process on an isolated domain
    golden: compares against frozen fixtures / oracle cores
    slow: launch_testing or long replays
