# 좌팔 + 스톡 그리퍼 — fake 플랜트 (scripts/fakes). 실기 yaml 과 토픽 계약이 같다:
#   /joint_states ← fake_arm_bridge, /objects/cup_big_s100/pose ← fake_cup_pose_pub (출력 토픽 인자, M8)
robot: gripper_left_fake
joint_profile: robot_control/src/robot_control/profiles/openarm_tesollo.yaml
sources:
  arm:
    type: joint_state
    topic: /joint_states
    joints: [l_aj_1, l_aj_2, l_aj_3, l_aj_4, l_aj_5, l_aj_6, l_aj_7]
    naming: source
    stale_sec: 0.5
  ee:
    type: joint_state
    topic: /joint_states
    joints: [l_hj_gripper_1]
    mirror: {l_hj_gripper_2: l_hj_gripper_1}
    velocity: zero
    naming: source
    stale_sec: 0.5
  object:
    type: pose
    topic: /objects/cup_big_s100/pose
    frame: base_link
    mode: attach_after_gate
    stale_sec: 0.5
  decoder_target:
    type: joint_state
    topic: /policy_control/joint_target
    joints: [l_hj_gripper_1]
    naming: canonical
    required: false
    stale_sec: 1.0
  head:
    type: joint_state
    topic: /head/joint_states
    joints: [head_j_pan, head_j_tilt]
    naming: canonical
    required: false
    stale_sec: 1.0
groups:
  left_arm:
    backend: arm_forward
    side: left
    jtc: left_joint_trajectory_controller
    forward: [left_forward_position_controller, left_forward_velocity_controller, left_forward_effort_controller]
  left_gripper:
    backend: jtc_single_point
    topic: /left_gripper_controller/joint_trajectory
    joint: openarm_left_finger_joint1
    close_overtravel_m: 0.008
table:
  top: 0.200   # fake 플랜트 = 학습 sim 세계(테이블 0.200, 컵 원점 0.29209). 실기 yaml 은 0.205
  clearance_min: 0.03
  # 판 xy 범위 — live 노드 TABLE 상수(cx 0.375, cy -0.165, sx 0.550, sy 0.970). 밖에서는 여유 검사 면제
  center_xy: [0.375, -0.165]
  size_xy: [0.550, 0.970]
