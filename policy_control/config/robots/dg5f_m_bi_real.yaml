# 양팔 DG-5F-M (hdgp/assets/robot/openarm_dg5f-m_bi_rl, 09.05 기본 자산) — real. 소스 역할에 팔 접미사(_left/_right).
# 한 팔만 시험할 때는 dg5f_m_{left,right}_real.yaml 을 쓴다; 이 파일은 두 팔을 동시에 배선한다.
robot: dg5f_m_bi_real
joint_profiles:
  - robot_control/src/robot_control/profiles/openarm_tesollo.yaml
  - sim2real/config/openarm_tesollo_left_hand.yaml
sources:
  arm_right:
    type: joint_state
    topic: /joint_states
    joints: [r_aj_1, r_aj_2, r_aj_3, r_aj_4, r_aj_5, r_aj_6, r_aj_7]
    naming: source
    stale_sec: 0.5
  ee_right:
    type: joint_state
    topic: /dg5f_right/joint_states
    joints: [r_hj_thumb_1, r_hj_thumb_2, r_hj_thumb_3, r_hj_thumb_4, r_hj_index_1, r_hj_index_2, r_hj_index_3, r_hj_index_4, r_hj_middle_1, r_hj_middle_2, r_hj_middle_3, r_hj_middle_4, r_hj_ring_1, r_hj_ring_2, r_hj_ring_3, r_hj_ring_4, r_hj_pinky_1, r_hj_pinky_2, r_hj_pinky_3, r_hj_pinky_4]
    naming: source
    effort_unit: raw_current
    stale_sec: 0.5
  tip_force_right:
    type: float_array
    topic: /dg5f_right/tip_forces_xyz
    tips: [r_hl_thumb_tip, r_hl_index_tip, r_hl_middle_tip, r_hl_ring_tip, r_hl_pinky_tip]
    axes: 3
    stale_sec: 0.5
  decoder_target_right:
    type: joint_state
    topic: /policy_control/joint_target
    joints: [r_hj_thumb_1, r_hj_thumb_2, r_hj_thumb_3, r_hj_thumb_4, r_hj_index_1, r_hj_index_2, r_hj_index_3, r_hj_index_4, r_hj_middle_1, r_hj_middle_2, r_hj_middle_3, r_hj_middle_4, r_hj_ring_1, r_hj_ring_2, r_hj_ring_3, r_hj_ring_4, r_hj_pinky_1, r_hj_pinky_2, r_hj_pinky_3, r_hj_pinky_4]
    naming: canonical
    required: false
    stale_sec: 1.0
  arm_left:
    type: joint_state
    topic: /joint_states
    joints: [l_aj_1, l_aj_2, l_aj_3, l_aj_4, l_aj_5, l_aj_6, l_aj_7]
    naming: source
    stale_sec: 0.5
  ee_left:
    type: joint_state
    topic: /dg5f_left/joint_states
    joints: [l_hj_thumb_1, l_hj_thumb_2, l_hj_thumb_3, l_hj_thumb_4, l_hj_index_1, l_hj_index_2, l_hj_index_3, l_hj_index_4, l_hj_middle_1, l_hj_middle_2, l_hj_middle_3, l_hj_middle_4, l_hj_ring_1, l_hj_ring_2, l_hj_ring_3, l_hj_ring_4, l_hj_pinky_1, l_hj_pinky_2, l_hj_pinky_3, l_hj_pinky_4]
    naming: source
    effort_unit: raw_current
    stale_sec: 0.5
  tip_force_left:
    type: float_array
    topic: /dg5f_left/tip_forces_xyz
    tips: [l_hl_thumb_tip, l_hl_index_tip, l_hl_middle_tip, l_hl_ring_tip, l_hl_pinky_tip]
    axes: 3
    stale_sec: 0.5
  decoder_target_left:
    type: joint_state
    topic: /policy_control/joint_target
    joints: [l_hj_thumb_1, l_hj_thumb_2, l_hj_thumb_3, l_hj_thumb_4, l_hj_index_1, l_hj_index_2, l_hj_index_3, l_hj_index_4, l_hj_middle_1, l_hj_middle_2, l_hj_middle_3, l_hj_middle_4, l_hj_ring_1, l_hj_ring_2, l_hj_ring_3, l_hj_ring_4, l_hj_pinky_1, l_hj_pinky_2, l_hj_pinky_3, l_hj_pinky_4]
    naming: canonical
    required: false
    stale_sec: 1.0
  object:
    type: pose
    topic: /objects/cup_big_s100/pose
    frame: base_link
    mode: live
    stale_sec: 0.5
  head:
    type: joint_state
    topic: /head/joint_states
    joints: [head_j_pan, head_j_tilt]
    naming: canonical
    required: false
    stale_sec: 1.0
groups:
  right_arm:
    backend: arm_forward
    side: right
    jtc: right_joint_trajectory_controller
    forward: [right_forward_position_controller, right_forward_velocity_controller, right_forward_effort_controller]
  right_hand:
    backend: dg5f_jtc
    topic: /dg5f_right/dg5f_right_controller/joint_trajectory
    namespace: dg5f_right
    pid_p: 1.5   # 2026-09-06 사용자 확정: DG-5F 손도 벤더 기본값만(구 실기 튜닝 4.5 폐기)
  left_arm:
    backend: arm_forward
    side: left
    jtc: left_joint_trajectory_controller
    forward: [left_forward_position_controller, left_forward_velocity_controller, left_forward_effort_controller]
  left_hand:
    backend: dg5f_jtc
    topic: /dg5f_left/dg5f_left_controller/joint_trajectory
    namespace: dg5f_left
    pid_p: 1.5   # 2026-09-06 사용자 확정: DG-5F 손도 벤더 기본값만(구 실기 튜닝 4.5 폐기)
table:
  top: 0.205
  clearance_min: -0.01
  center_xy: [0.375, -0.165]
  size_xy: [0.550, 0.970]
