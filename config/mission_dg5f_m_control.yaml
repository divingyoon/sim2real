# policy_control — 양팔 DG-5F-M(hdgp/assets/robot/openarm_dg5f-m_bi_rl) 제어 전용 실기 점검, 한 팔씩.
#   python3 scripts/ops/mission_run.py --mission config/mission_dg5f_m_control.yaml --plan
#   실기 단계(touches_real)는 --execute 에 더해 --approve <id> 가 필수다(단계당 1회).
# 정책은 없다(제어 전용 계약): pd(engage/selftest/goto_home) → fabric direct 모드(palm_cmd/hand_cmd) 까지가 목표.
# 우·좌 단계는 bringup 뒤 서로 독립이라 어느 팔을 먼저 해도 된다. 반대 팔은 차렷(전원만)으로 둔다.
# ★모든 노드/도구는 --execute / execute:=true 없이는 아무것도 발행하지 않는다.
name: policy_control 양팔 DG-5F-M 제어 전용 점검 (한 팔씩)

artifacts:
  contract: logs/policy/asset_openarm_dg5f-m_bi_rl/deploy_contract.json
  robot_right: policy_control/config/robots/dg5f_m_right_real.yaml
  robot_left: policy_control/config/robots/dg5f_m_left_real.yaml
  robot_bi: policy_control/config/robots/dg5f_m_bi_real.yaml
  pd: policy_control/config/pd_dg5f_m.yaml
  gains_yaml: ../urdf/vendor/openarm_description/config/arm/v10/control_gains.yaml

checkpoints: {}

stages:
  - id: preflight
    title: 테스트·자산 계약 재생성↔게인 대조·forward 컨트롤러 양팔 선언 확인 (읽기 전용)
    artifacts: [contract, gains_yaml]

  - id: bringup
    title: 모터 전원 → CAN ×2 → openarm_bringup (robot_control) → DG-5F 드라이버 ×2 → head_home
    needs: [preflight]
    needs_why: 점검 전에 띄우면 오배선 상태로 모터가 돈다
    touches_real: true

  # ---------------------------------------------------------------- RIGHT 팔
  - id: pd_load_right
    title: "[right] pd 노드 무발행 기동 (sides:=right, execute:=false) — forward 3종 load(inactive), 손 PID 4.5 확인"
    needs: [bringup]
    artifacts: [contract, robot_right, pd]
    touches_real: true

  - id: pd_selftest_right
    title: "[right] engage → hold 10 s → 단일관절 ±0.02/0.05/0.10 rad → release (드리프트·부호·교대 점프)"
    needs: [pd_load_right]
    touches_real: true

  - id: goto_home_right
    title: "[right] 계약 홈(차렷 0)으로 0.1 rad/s 램프 후 정착 — τ_ff 는 model_tau_ff"
    needs: [pd_selftest_right]
    touches_real: true

  - id: fabric_direct_right
    title: "[right] fabric 노드 direct 모드 + palm_cmd ±2 cm · hand_cmd open→close 0.3 (작은 델타만)"
    needs: [goto_home_right]
    artifacts: [contract, robot_right]
    touches_real: true

  - id: release_right
    title: "[right] pd release (역블렌드 → JTC 복귀) — robotctl pose 동작 확인"
    needs: [fabric_direct_right]
    touches_real: true

  # ---------------------------------------------------------------- LEFT 팔
  - id: pd_load_left
    title: "[left] pd 노드 무발행 기동 (sides:=left, execute:=false) — forward 3종 load(inactive), 손 PID 4.5 확인"
    needs: [bringup]
    artifacts: [contract, robot_left, pd]
    touches_real: true

  - id: pd_selftest_left
    title: "[left] engage → hold 10 s → 단일관절 ±0.02/0.05/0.10 rad → release (드리프트·부호·교대 점프)"
    needs: [pd_load_left]
    touches_real: true

  - id: goto_home_left
    title: "[left] 계약 홈(차렷 0)으로 0.1 rad/s 램프 후 정착 — τ_ff 는 model_tau_ff"
    needs: [pd_selftest_left]
    touches_real: true

  - id: fabric_direct_left
    title: "[left] fabric 노드 direct 모드 + palm_cmd ±2 cm · hand_cmd open→close 0.3 (작은 델타만)"
    needs: [goto_home_left]
    artifacts: [contract, robot_left]
    touches_real: true

  - id: release_left
    title: "[left] pd release (역블렌드 → JTC 복귀) — robotctl pose 동작 확인"
    needs: [fabric_direct_left]
    touches_real: true

run:
  preflight:
    - note: policy_control 비GPU 테스트 전부
      argv: [python3, -m, pytest, "{repo}/tests/policy_control", -q, -m, "not gpu", -p, "no:cacheprovider"]
    - note: 자산 제어 전용 계약 재생성 + control_gains.yaml 대조 (MISMATCH 면 rc 3)
      argv: [python3, "{repo}/policy_control/tools/build_deploy_contract.py", --asset, openarm_dg5f-m_bi_rl,
             --home, zero, --gains, "{artifact:gains_yaml}", --out, "{artifact:contract}"]
    - note: forward 컨트롤러가 양팔 모두 bringup 설정에 선언돼 있는지 (grep, 좌 3 + 우 3)
      argv: [grep, -c, "_forward_", "/home/user/rl_ws/robot_control/ros_ws/src/openarm_ros2/openarm_bringup/config/controllers/openarm_bimanual_controllers.yaml"]
  bringup:
    - note: ★CAN 설정 — sudo 필요, 사용자 셸에서 (can0 우 / can1 좌)
      argv: [sudo, ip, link, set, can0, up, type, can, bitrate, "1000000", fd, "on"]
      manual: true
    - note: ★모터 전원을 먼저 켠 뒤 launch (forward 컨트롤러 선언 포함)
      argv: [ros2, launch, openarm_bringup, openarm.bimanual.launch.py, "use_fake_hardware:=false",
             "right_can_interface:=can0", "left_can_interface:=can1"]
      manual: true
    - note: ★DG-5F 드라이버 — 우 dg5f_right / 좌 dg5f_left 네임스페이스 (좌 PID 기본 1.5 는 pd engage 가 4.5 로 올린다)
      argv: [echo, "ros2 launch <dg5f driver> namespace:=dg5f_left / dg5f_right — 사용자 셸에서"]
      manual: true
    - note: 목 기준자세 + I게인 재적용
      argv: [python3, "{repo}/scripts/head_home.py"]
      execute_args: [--execute]
  pd_load_right:
    - note: "[right] pd 노드 무발행 기동 — 별도 launch"
      argv: [ros2, launch, "{repo}/policy_control/launch/pd_controller.launch.py",
             "contract:={artifact:contract}", "robot:={artifact:robot_right}", "pd_config:={artifact:pd}",
             "sides:=right", "execute:=false"]
      background: true
  pd_selftest_right:
    - note: "[right] 셀프테스트 (pd 를 execute:=true 로 재기동한 뒤). 진폭 0.02→0.05→0.10 rad"
      argv: [python3, "{repo}/policy_control/tools/pd_selftest.py", --contract, "{artifact:contract}",
             --robot, "{artifact:robot_right}", --side, right, --amplitudes, "0.02,0.05,0.10",
             --out, "{repo}/logs/policy_control/real_dg5fm_right_selftest.json"]
      execute_args: [--execute]
  goto_home_right:
    - note: "[right] pd engage + goto_home (episode_ctl 단계 — 승인 pd_engage·pd_goto_home)"
      argv: [python3, "{repo}/policy_control/tools/episode_ctl.py", --steps, "0",
             --approve, pd_engage, --approve, pd_goto_home]
      execute_args: [--execute]
  fabric_direct_right:
    - note: "[right] fabric 노드 direct 모드 (계약이 control_only 라 obs/policy 는 안 뜬다)"
      argv: [ros2, launch, "{repo}/policy_control/launch/policy_chain.launch.py",
             "contract:={artifact:contract}", "robot:={artifact:robot_right}", "side:=right", "device:=cuda:0"]
      background: true
    - note: "[right] 에피소드 reset (fabric 이 armed 가 될 때까지 status/fabric 확인)"
      argv: [ros2, service, call, /policy_control/episode/reset, std_srvs/srv/Trigger]
    - note: "[right] 에피소드 start — fabric 이 홈 palm 을 유지하며 적분 시작(팔은 홈에 머문다)"
      argv: [ros2, service, call, /policy_control/episode/start, std_srvs/srv/Trigger]
    - note: "[right] palm +2 cm z (실기 기본 도메인이면 --allow-domain-0 가 필요 — 승인 후 사용자가 붙인다)"
      argv: [python3, "{repo}/policy_control/tools/palm_cmd.py", --rel, "0", "0", "0.02", --hold, "1.0"]
    - note: "[right] 손 30 % 폐쇄 후 다시 open"
      argv: [python3, "{repo}/policy_control/tools/hand_cmd.py", --contract, "{artifact:contract}", --side, right,
             --close, "0.3", --hold, "1.0"]
  release_right:
    - note: "[right] 에피소드 stop 후 pd release — 역블렌드 → 0 송출 → JTC 복귀"
      argv: [ros2, service, call, /policy_control/episode/stop, std_srvs/srv/Trigger]
    - note: "[right] pd release 서비스 (실패 시 복구 CLI: tools/pd_release.py --side right --execute)"
      argv: [ros2, service, call, /policy_control/pd/release, std_srvs/srv/Trigger]
  pd_load_left:
    - note: "[left] pd 노드 무발행 기동 — 별도 launch"
      argv: [ros2, launch, "{repo}/policy_control/launch/pd_controller.launch.py",
             "contract:={artifact:contract}", "robot:={artifact:robot_left}", "pd_config:={artifact:pd}",
             "sides:=left", "execute:=false"]
      background: true
  pd_selftest_left:
    - note: "[left] 셀프테스트 (pd 를 execute:=true 로 재기동한 뒤). 진폭 0.02→0.05→0.10 rad"
      argv: [python3, "{repo}/policy_control/tools/pd_selftest.py", --contract, "{artifact:contract}",
             --robot, "{artifact:robot_left}", --side, left, --amplitudes, "0.02,0.05,0.10",
             --out, "{repo}/logs/policy_control/real_dg5fm_left_selftest.json"]
      execute_args: [--execute]
  goto_home_left:
    - note: "[left] pd engage + goto_home (episode_ctl 단계 — 승인 pd_engage·pd_goto_home)"
      argv: [python3, "{repo}/policy_control/tools/episode_ctl.py", --steps, "0",
             --approve, pd_engage, --approve, pd_goto_home]
      execute_args: [--execute]
  fabric_direct_left:
    - note: "[left] fabric 노드 direct 모드 (계약이 control_only 라 obs/policy 는 안 뜬다)"
      argv: [ros2, launch, "{repo}/policy_control/launch/policy_chain.launch.py",
             "contract:={artifact:contract}", "robot:={artifact:robot_left}", "side:=left", "device:=cuda:0"]
      background: true
    - note: "[left] 에피소드 reset (fabric 이 armed 가 될 때까지 status/fabric 확인)"
      argv: [ros2, service, call, /policy_control/episode/reset, std_srvs/srv/Trigger]
    - note: "[left] 에피소드 start — fabric 이 홈 palm 을 유지하며 적분 시작(팔은 홈에 머문다)"
      argv: [ros2, service, call, /policy_control/episode/start, std_srvs/srv/Trigger]
    - note: "[left] palm +2 cm z (실기 기본 도메인이면 --allow-domain-0 가 필요 — 승인 후 사용자가 붙인다)"
      argv: [python3, "{repo}/policy_control/tools/palm_cmd.py", --rel, "0", "0", "0.02", --hold, "1.0"]
    - note: "[left] 손 30 % 폐쇄 후 다시 open"
      argv: [python3, "{repo}/policy_control/tools/hand_cmd.py", --contract, "{artifact:contract}", --side, left,
             --close, "0.3", --hold, "1.0"]
  release_left:
    - note: "[left] 에피소드 stop 후 pd release — 역블렌드 → 0 송출 → JTC 복귀"
      argv: [ros2, service, call, /policy_control/episode/stop, std_srvs/srv/Trigger]
    - note: "[left] pd release 서비스 (실패 시 복구 CLI: tools/pd_release.py --side left --execute)"
      argv: [ros2, service, call, /policy_control/pd/release, std_srvs/srv/Trigger]
