# 로봇 구성 프로필 — **좌팔 7 DOF + 2지 평행 그리퍼** (자산 openarm_tesollo_sensor_rl).
#
# `tesollo_sensor__right` 와 **같은 로봇의 반대쪽**이다. 우팔에는 DG-5F 가, 좌팔에는 이
# 그리퍼가 달려 있고 둘 다 실기 그대로다. 그래서 두 프로필은 자산 매니페스트를 공유하고
# `acting_side` 와 EE 만 다르다.
#
# ★이 태스크만 다른 점이 두 가지 있다. 둘 다 배포 코드가 알아야 한다.
#   ① **manager-based** 다(`isaaclab.envs:ManagerBasedRLEnv`). `grasp_left_env.py` 도
#      `grasp_left_constants.py` 도 없다 — obs 차원은 ObservationManager 가 런타임에
#      조립하므로 소스에서 셀 수 없다. 그래서 계약을 체크포인트에 대고 검증한다
#      (`contract.source: checkpoint`).
#   ② 팔 액션이 **절대 palm 6D** 다. `grasp_v1`/`grasp_sensor` 의 델타+기준점(anchor)
#      규약이 아니다 — a=0 은 "기준점 유지"가 아니라 `PALM_BOX` 의 중심이다. 그래서
#      `action_anchor` 개념 자체가 적용되지 않는다. 액션 산술은
#      `scripts/gripper_left_palm_command.py` 가 preset 에서 받아 계산한다.
name: gripper_left

asset:
  manifest: ../hdgp/assets/robot/openarm_tesollo_sensor_rl/openarm_tesollo_sensor_rl_manifest.yaml
  fabrics:
    # sim 학습과 동일 — `grasp_left_preset.FABRIC_ROBOT_DIR` / `FABRIC_WORLD_FILENAME`.
    # 이 URDF 는 손 20관절을 fixed 로 동결해 cspace 가 팔 7 DOF 만 남는다.
    # world 는 **좌팔 전용**이다. 우팔용을 쓰면 좌팔이 자기 대역물을 장애물로 읽는다.
    robot_dir: openarm_tesollo_sensor_left_gripper
    robot_name: openarm_tesollo_sensor_left_gripper
    class: OpenArmGripperLeftPoseFabric
    world: open_gripper_left_boxes_no_table

acting_side: left

end_effector:
  # 매니페스트의 좌 EE 관절은 `l_hj_gripper_1` 하나다. sim USD 는 mimic 을 잃어 두 조를
  # 다 지령해야 하지만(`grasp_left_preset.py:35-47`), 실기 URDF 는 mimic 이 살아 있어
  # 한 개면 두 조가 함께 벌어진다 — SRDF 도 finger_joint2 를 passive_joint 로 적는다.
  type: parallel_gripper
  dof: 1

contract:
  # ★08.31 v2 전환 — 배포 대상은 grasp_sensor_v2 의 `v2H_wide_best`(ep740, rew 98.98).
  #   grasp_sensor 트랙(fab_test16, obs 36)에서 obs 가 13 늘었다:
  # 49 = joint_pos 9 + joint_vel 9 + object_position_noisy 3 + object_pose command 7
  #      + last_action 7 + gripper_gate 1 + tcp_pos 3 + palm_rot6d 6
  #      + goal_minus_cup 3 + cup_upright 1.  action 7 = palm 절대 6 + 그리퍼 이진 1 (불변).
  # 소스에 이 숫자를 적어 둔 곳이 없어 체크포인트에서 읽어 검증한다.
  # hdgp_package 가 v2 가 아닌 이유: 프로필의 홈·preset 해석이
  # `{package}.grasp_left_preset` 을 import 하는데, v2 는 preset 을 새로 만들지 않고
  # v1 것을 그대로 쓴다(`v2_preset.py` 서두 — "기하·자산·홈·스폰·액션 상수는 불변").
  hdgp_package: openarm.gripper.left.grasp_sensor
  obs_dim: 49
  action_dim: 7
  source: checkpoint
  # 08.31 재교체(사용자 지정): v2B17 → **v2E19_zfloor_ep1800**. 계약 동일(obs49/act7/MLP).
  #   ★홈 = 런 dump(left_v2E19/params/env.yaml, arm5080 회수)가 **구 v1 홈**을 확정
  #     (-0.0136,-0.3757,-0.0010,+0.9336,-0.4655,+0.0003,-0.3306) — J147(B17 실험홈) 아님.
  #     따라서 리셋 궤적은 기존 reset_left.npz 그대로 유효.
  # 이전 후보: left_v2B17/nn/(3종) · left_v2H_wide/nn/v2H_wide_best.pth
  checkpoint: logs/policy/left_v2E19/nn/v2E19_zfloor_ep1800.pth

action:
  # 절대 규약. a=0 은 "기준점 유지"가 아니라 `PALM_BOX` 의 **중심**이다 —
  # 델타+기준점 트랙(grasp_v1 / grasp_sensor)과 정반대이므로 그쪽 계약 테스트를
  # 이 구성에 그대로 적용하면 안 된다. 산술은 scripts/gripper_left_palm_command.py.
  convention: absolute_palm

topics:
  arm_state:  /joint_states
  arm_cmd:    /isaacsim/left_arm_cmd
  arm_traj:   /left_joint_trajectory_controller/joint_trajectory
  # 좌 그리퍼 명령은 20D 손과 달리 **스칼라**다(std_msgs/Float64). Humble 에는
  # parallel_gripper_action_controller 가 없어 left_gripper_controller 도 JTC 다.
  ee_state:   /joint_states
  ee_cmd:     /isaacsim/left_gripper_cmd
  ee_traj:    /left_gripper_controller/joint_trajectory

joint_profiles:
  - ~/rl_ws/robot_control/src/robot_control/profiles/openarm_tesollo.yaml

# 이 구성에는 손끝 F/T 가 없다 — 2지 그리퍼에 wrench broadcaster 가 없다.
# 정책 obs 도 접촉력을 쓰지 않으므로(위 36D 내역 참조) tip_sensor 항목 자체를 두지 않는다.
