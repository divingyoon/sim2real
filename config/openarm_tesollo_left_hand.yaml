# 좌 Tesollo DG-5F 20관절 canonical↔source 보충 프로필.
#
# 왜 있는가: robot_control profile(openarm_tesollo.yaml)은 좌측 EE 로 2지 그리퍼
# (l_hj_gripper_1)만 담고 있어 좌 Tesollo 매핑이 없다. upstream 에 좌손 항목이
# 들어오면 **이 파일을 삭제**하고 joint_profiles 목록에서 빼라.
#
# 유도 규칙(검증됨): 우손 profile 항목의 lower/upper 를 grasp_left_preset.py
# `_HAND_SIGN`(thumb[-1,-1,-1,-1] / index·middle·ring[-1,+1,+1,+1] / pinky[-1,-1,+1,+1])
# 이 -1 인 관절만 부호반전+스왑. sign 은 전 관절 +1.
# 벤더 좌손 URDF(urdf/vendor/delto_m_ros2/dg_description/urdf/dg5f_left.urdf)의
# lj_dg_* limit 과 **20/20 일치** 확인함.
name: openarm_tesollo_left_hand
